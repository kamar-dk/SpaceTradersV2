<nav mat-tab-nav-bar [tabPanel]="panel" mat-stretch-tabs="false" mat-align-tabs="start">
    @for (tab of tabs(); track tab.symbol) {
        <a mat-tab-link [routerLink]="['/map', tab.symbol]" [active]="tab.symbol === system()">
            {{ tab.label }}
            @if (tab.ships) {
                <span class="count">{{ tab.ships }}</span>
            }
        </a>
    }
</nav>

<mat-tab-nav-panel #panel class="content">
    <app-system-map [system]="system()" />

    <aside class="side">
        <mat-accordion class="side-panels">
            <mat-expansion-panel expanded>
                <mat-expansion-panel-header>
                    <mat-panel-title>Ships in system</mat-panel-title>
                </mat-expansion-panel-header>

                <div class="cards">
                    @for (ship of pagedShips(); track ship.symbol) {
                        <app-ship-card [ship]="ship" compact />
                    } @empty {
                        <p class="hint">No ships in this system.</p>
                    }
                </div>

                @if (ships().length > shipsPerPage) {
                    <mat-paginator
                        [length]="ships().length"
                        [pageSize]="shipsPerPage"
                        [pageIndex]="pageIndex()"
                        (page)="onPage($event)"
                        hidePageSize />
                }
            </mat-expansion-panel>
            <mat-expansion-panel hideToggle>
                <mat-expansion-panel-header>
                    <mat-panel-title>Waypoints in system</mat-panel-title>
                </mat-expansion-panel-header>
                Waypoints here
            </mat-expansion-panel>  
        </mat-accordion>       
    </aside>
</mat-tab-nav-panel>
